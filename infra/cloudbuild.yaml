# ==============================================================================
# Cloud Build Pipeline: Infrastructure (Terraform)
# ==============================================================================
# - Pull Request Triggers: Runs 'terraform plan' only (detected via native _PR_NUMBER)
# - Main Merge / Tag Triggers: Runs 'terraform plan' followed by 'terraform apply'
# ==============================================================================

steps:
  # 1. Resolve Environment & Terraform Init
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        RAW_ENV="${_ENVIRONMENT}"
        case "$PROJECT_ID" in
          *dev*)
            ENVIRONMENT="development"
            ENVIRONMENT_SHORT="dev"
            ;;
          *stg*)
            ENVIRONMENT="staging"
            ENVIRONMENT_SHORT="stg"
            ;;
          *prd*)
            ENVIRONMENT="production"
            ENVIRONMENT_SHORT="prd"
            ;;
          *)
            case "$$RAW_ENV" in
              stg|staging)
                ENVIRONMENT="staging"
                ENVIRONMENT_SHORT="stg"
                ;;
              prd|prod|production)
                ENVIRONMENT="production"
                ENVIRONMENT_SHORT="prd"
                ;;
              dev|development|*)
                ENVIRONMENT="development"
                ENVIRONMENT_SHORT="dev"
                ;;
            esac
            ;;
        esac

        ENV_FILE="environments/$${ENVIRONMENT}.tfvars"
        if [ ! -f "$$ENV_FILE" ]; then
          echo "Error: Environment tfvars file '$$ENV_FILE' not found!"
          exit 1
        fi

        # Extract project_id from the environment tfvars file if not explicitly passed
        if [ -n "${_TARGET_PROJECT_ID}" ]; then
          TARGET_PROJECT_ID="${_TARGET_PROJECT_ID}"
        else
          TARGET_PROJECT_ID=$$(grep -E '^[[:space:]]*project_id[[:space:]]*=' "$$ENV_FILE" | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' | tr -d '[:space:]')
        fi

        if [ -z "$$TARGET_PROJECT_ID" ]; then
          echo "Error: Could not determine TARGET_PROJECT_ID from $$ENV_FILE or _TARGET_PROJECT_ID"
          exit 1
        fi

        STATE_BUCKET="${_STATE_BUCKET}"
        if [ -z "$$STATE_BUCKET" ]; then
          STATE_BUCKET="gcs-$${TARGET_PROJECT_ID}-tfstate"
        fi
        STATE_PREFIX="${_STATE_PREFIX}"
        if [ -z "$$STATE_PREFIX" ]; then
          STATE_PREFIX="terraform/infra/state"
        fi

        # Persist context for subsequent steps
        echo "ENVIRONMENT=$$ENVIRONMENT" > .env.build
        echo "ENVIRONMENT_SHORT=$$ENVIRONMENT_SHORT" >> .env.build
        echo "ENV_FILE=$$ENV_FILE" >> .env.build
        echo "TARGET_PROJECT_ID=$$TARGET_PROJECT_ID" >> .env.build

        echo "=================================================================="
        echo "Initializing Terraform for: $$ENVIRONMENT ($$ENVIRONMENT_SHORT)"
        echo "Target Project: $$TARGET_PROJECT_ID"
        echo "Bucket: $$STATE_BUCKET"
        echo "Prefix: $$STATE_PREFIX"
        echo "=================================================================="

        terraform init -reconfigure \
          -backend-config="bucket=$$STATE_BUCKET" \
          -backend-config="prefix=$$STATE_PREFIX"
    dir: 'infra'

  # 2. Terraform Plan
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        . ./.env.build
        echo "=================================================================="
        echo "Running Terraform Plan using: $$ENV_FILE ($$ENVIRONMENT / $$ENVIRONMENT_SHORT)"
        echo "=================================================================="

        terraform plan \
          -out=tfplan \
          -var-file="$$ENV_FILE" \
          -var="region=$_REGION" \
          -var="environment=$$ENVIRONMENT"
    dir: 'infra'

  # 3. Terraform Apply (Runs ONLY on main branch push, tag push, or explicit _TF_ACTION=apply)
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        . ./.env.build
        SHOULD_APPLY=false
        if [ "${_TF_ACTION}" = "apply" ]; then
          SHOULD_APPLY=true
        elif [ "${_TF_ACTION}" = "plan" ]; then
          SHOULD_APPLY=false
        elif [ "${_TF_ACTION}" = "auto" ] || [ -z "${_TF_ACTION}" ]; then
          if [ "$BRANCH_NAME" = "main" ] || [ -n "$TAG_NAME" ]; then
            SHOULD_APPLY=true
          fi
        fi

        if [ "$$SHOULD_APPLY" != "true" ]; then
          echo "=================================================================="
          echo "Skipping terraform apply (planning only)."
          echo "Trigger details: BRANCH_NAME='$BRANCH_NAME', TAG_NAME='$TAG_NAME', _TF_ACTION='${_TF_ACTION}'"
          echo "(Terraform apply executes only on 'main' branch, tag push, or when _TF_ACTION='apply')"
          echo "=================================================================="
          exit 0
        fi

        echo "=================================================================="
        echo "Applying pre-computed Terraform plan for $$ENVIRONMENT (Branch: $BRANCH_NAME, Tag: $TAG_NAME)"
        echo "=================================================================="
        terraform apply -auto-approve tfplan
    dir: 'infra'

substitutions:
  _TF_ACTION: 'auto'              # 'auto' (applies on main/tag, plans on other branches), or 'plan' / 'apply'
  _ENVIRONMENT: 'development'     # 'development', 'staging', 'production'
  _TARGET_PROJECT_ID: ''          # Auto-detected from tfvars if empty
  _STATE_PREFIX: 'terraform/infra/state'
  _STATE_BUCKET: ''               # Defaults to gcs-${TARGET_PROJECT_ID}-tfstate
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
