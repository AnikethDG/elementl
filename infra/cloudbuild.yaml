steps:
  - id: resolve-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    dir: infra
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Default to non-sensitive staging GCP project (pid-nse-stg-core-apps-k8ti)
        ENVIRONMENT="staging"
        ENVIRONMENT_SHORT="stg"
        TF_VARS_FILE="environments/staging.tfvars"
        UDP_TF_VARS_FILE="environments/staging.tfvars"
        TARGET_PROJECT="pid-nse-stg-core-apps-k8ti"
        STATE_BUCKET="gcs-pid-nse-stg-core-apps-k8ti-tfstate"

        # Verify if the active Cloud Build runner service account has access to the staging state bucket.
        # If running inside an isolated dev-only PR trigger SA without cross-project access to staging,
        # gracefully fall back to the trigger project's state bucket for CI validation.
        if ! gcloud storage ls "gs://$${STATE_BUCKET}" >/dev/null 2>&1; then
          echo "Staging state bucket gs://$${STATE_BUCKET} not accessible by current runner SA; falling back to trigger project (${PROJECT_ID}) for CI plan."
          case "${PROJECT_ID}" in
            *prd*)
              ENVIRONMENT="production"
              ENVIRONMENT_SHORT="prd"
              ;;
            *stg*)
              ENVIRONMENT="staging"
              ENVIRONMENT_SHORT="stg"
              ;;
            *)
              ENVIRONMENT="development"
              ENVIRONMENT_SHORT="dev"
              ;;
          esac
          TF_VARS_FILE="environments/$${ENVIRONMENT}.tfvars"
          UDP_TF_VARS_FILE="environments/$${ENVIRONMENT}.tfvars"
          TARGET_PROJECT="${PROJECT_ID}"
          STATE_BUCKET="gcs-$${TARGET_PROJECT}-tfstate"
        fi

        STATE_PREFIX="${_STATE_PREFIX:-terraform/infra/state}"
        UDP_STATE_PREFIX="${_UDP_STATE_PREFIX:-terraform/udp/state}"

        cat <<EOF > /workspace/tf_env.sh
        export ENVIRONMENT="$${ENVIRONMENT}"
        export ENVIRONMENT_SHORT="$${ENVIRONMENT_SHORT}"
        export TF_VARS_FILE="$${TF_VARS_FILE}"
        export UDP_TF_VARS_FILE="$${UDP_TF_VARS_FILE}"
        export TARGET_PROJECT="$${TARGET_PROJECT}"
        export STATE_BUCKET="$${STATE_BUCKET}"
        export STATE_PREFIX="$${STATE_PREFIX}"
        export UDP_STATE_PREFIX="$${UDP_STATE_PREFIX}"
        EOF

        cat /workspace/tf_env.sh

  # =========================================================================
  # Stack 1: Root Core Application Infrastructure (infra/)
  # State file: gs://<STATE_BUCKET>/terraform/infra/state/default.tfstate
  # =========================================================================
  - id: terraform-init
    name: hashicorp/terraform:1.9.8
    dir: infra
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        . /workspace/tf_env.sh
        terraform init -reconfigure \
          -backend-config="bucket=$${STATE_BUCKET}" \
          -backend-config="prefix=$${STATE_PREFIX}"

  - id: terraform-validate
    name: hashicorp/terraform:1.9.8
    dir: infra
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        terraform validate

  - id: terraform-plan
    name: hashicorp/terraform:1.9.8
    dir: infra
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        . /workspace/tf_env.sh
        terraform plan -no-color -input=false -var-file="$${TF_VARS_FILE}" -out=tfplan

  - id: terraform-apply
    name: hashicorp/terraform:1.9.8
    dir: infra
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        if [ "${_ACTION}" = "apply" ]; then
          terraform apply -no-color -input=false -auto-approve tfplan
        else
          echo "Skipping root infra/ terraform apply because _ACTION='${_ACTION}'."
        fi

  # =========================================================================
  # Stack 2: Unified Data Platform (UDP) Infrastructure (infra/udp/)
  # Separate State file: gs://<STATE_BUCKET>/terraform/udp/state/default.tfstate
  # =========================================================================
  - id: udp-terraform-init
    name: hashicorp/terraform:1.9.8
    dir: infra/udp
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        . /workspace/tf_env.sh
        terraform init -reconfigure \
          -backend-config="bucket=$${STATE_BUCKET}" \
          -backend-config="prefix=$${UDP_STATE_PREFIX}"

  - id: udp-terraform-validate
    name: hashicorp/terraform:1.9.8
    dir: infra/udp
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        terraform validate

  - id: udp-terraform-plan
    name: hashicorp/terraform:1.9.8
    dir: infra/udp
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        . /workspace/tf_env.sh
        terraform plan -no-color -input=false -var-file="$${UDP_TF_VARS_FILE}" -out=udp_tfplan

  - id: udp-terraform-apply
    name: hashicorp/terraform:1.9.8
    dir: infra/udp
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        if [ "${_ACTION}" = "apply" ]; then
          terraform apply -no-color -input=false -auto-approve udp_tfplan
        else
          echo "Skipping infra/udp/ terraform apply because _ACTION='${_ACTION}'."
        fi

substitutions:
  _ENVIRONMENT: 'staging'
  _TARGET_PROJECT_ID: 'pid-nse-stg-core-apps-k8ti'
  _ACTION: 'plan'
  _STATE_PREFIX: 'terraform/infra/state'
  _UDP_STATE_PREFIX: 'terraform/udp/state'

options:
  logging: CLOUD_LOGGING_ONLY
