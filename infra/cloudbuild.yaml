# ==============================================================================
# Cloud Build Pipeline: Infrastructure (Terraform)
# ==============================================================================
# - Pull Request Triggers: Runs 'terraform plan' only (detected via native _PR_NUMBER)
# - Main Merge / Tag Triggers: Runs 'terraform plan' followed by 'terraform apply'
# ==============================================================================

steps:
  # 1. Resolve Environment & Terraform Init
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        ENV_NAME="${_ENVIRONMENT}"
        if [ "$$ENV_NAME" = "stg" ]; then ENV_NAME="staging"; fi
        if [ "$$ENV_NAME" = "prd" ]; then ENV_NAME="prod"; fi

        ENV_FOLDER="$$ENV_NAME"
        if [ "$$ENV_NAME" = "dev" ] || [ "$$ENV_NAME" = "development" ]; then
          ENV_FOLDER="development"
        elif [ "$$ENV_NAME" = "stg" ] || [ "$$ENV_NAME" = "staging" ]; then
          ENV_FOLDER="staging"
        elif [ "$$ENV_NAME" = "prd" ] || [ "$$ENV_NAME" = "prod" ] || [ "$$ENV_NAME" = "production" ]; then
          ENV_FOLDER="production"
        fi

        ENV_FILE="environments/$${ENV_NAME}.tfvars"
        if [ ! -f "$$ENV_FILE" ] && [ -f "environments/${_ENVIRONMENT}.tfvars" ]; then
          ENV_FILE="environments/${_ENVIRONMENT}.tfvars"
        fi

        # Extract project_id from tfvars
        TARGET_PROJECT_ID="${_TARGET_PROJECT_ID}"
        if [ -z "$$TARGET_PROJECT_ID" ] && [ -f "$$ENV_FILE" ]; then
          TARGET_PROJECT_ID=$$(sed -n 's/.*project_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$$ENV_FILE" | head -n 1)
        fi

        STATE_BUCKET="${_STATE_BUCKET:-gcs-$${TARGET_PROJECT_ID}-tfstate}"
        STATE_PREFIX="${_STATE_PREFIX:-terraform/infra/state}"

        # Persist context for subsequent steps
        echo "ENV_NAME=$$ENV_NAME" > .env.build
        echo "ENV_FILE=$$ENV_FILE" >> .env.build
        echo "TARGET_PROJECT_ID=$$TARGET_PROJECT_ID" >> .env.build

        echo "=================================================================="
        echo "Initializing Terraform for: $$ENV_NAME ($$ENV_FOLDER)"
        echo "Bucket: $$STATE_BUCKET"
        echo "Prefix: $$STATE_PREFIX"
        echo "=================================================================="

        terraform init -reconfigure \
          -backend-config="bucket=$$STATE_BUCKET" \
          -backend-config="prefix=$$STATE_PREFIX"
    dir: 'infra'

  # 2. Terraform Plan
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        . ./.env.build
        echo "=================================================================="
        echo "Running Terraform Plan using: $$ENV_FILE"
        echo "=================================================================="

        terraform plan \
          -out=tfplan \
          -var-file="$$ENV_FILE" \
          -var="region=$_REGION" \
          -var="environment=$$ENV_NAME"
    dir: 'infra'

  # 3. Terraform Apply (Skipped on PR triggers)
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        # Native Cloud Build PR trigger check or explicit plan mode
        if [ -n "$_PR_NUMBER" ] || [ "${_TF_ACTION}" = "plan" ]; then
          echo "=================================================================="
          echo "PR trigger detected (_PR_NUMBER='$_PR_NUMBER') or _TF_ACTION=plan."
          echo "Skipping terraform apply (planning only)."
          echo "=================================================================="
          exit 0
        fi

        echo "=================================================================="
        echo "Applying pre-computed Terraform plan (Branch: $BRANCH_NAME, Tag: $TAG_NAME)"
        echo "=================================================================="
        terraform apply -auto-approve tfplan
    dir: 'infra'

substitutions:
  _TF_ACTION: 'auto'     # 'auto' (applies on push/tag, plans on PR), or 'plan' / 'apply'
  _ENVIRONMENT: 'dev'    # 'dev', 'staging', 'prod'
  _TARGET_PROJECT_ID: '' # Auto-detected from tfvars if empty
  _STATE_PREFIX: ''      # Defaults to terraform/infra/state
  _STATE_BUCKET: ''      # Defaults to gcs-${TARGET_PROJECT_ID}-tfstate
  _REGION: 'us-central1'
  _PR_NUMBER: ''         # Injected automatically by Cloud Build GitHub PR triggers

options:
  logging: CLOUD_LOGGING_ONLY

