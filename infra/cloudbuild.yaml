# ==============================================================================
# Cloud Build Pipeline: Infrastructure (Root infra/ + UDP infra/udp/)
# ==============================================================================
# - Pull Request Triggers: Runs 'terraform plan' only (for both infra/ and infra/udp/)
# - Main Merge / Tag Triggers: Runs 'terraform plan' followed by 'terraform apply'
# ==============================================================================

steps:
  # 1. Resolve Environment & Terraform Init (Root infra/ + UDP infra/udp/)
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        RAW_ENV="${_ENVIRONMENT}"
        case "$$RAW_ENV" in
          stg|staging)
            ENVIRONMENT="staging"
            ENVIRONMENT_SHORT="stg"
            ;;
          prd|prod|production)
            ENVIRONMENT="production"
            ENVIRONMENT_SHORT="prd"
            ;;
          dev|development|*)
            ENVIRONMENT="development"
            ENVIRONMENT_SHORT="dev"
            ;;
        esac

        ENV_FILE="environments/$${ENVIRONMENT}.tfvars"
        if [ ! -f "$$ENV_FILE" ]; then
          echo "ERROR: Environment file '$$ENV_FILE' does not exist! Valid environments are development, staging, production." >&2
          exit 1
        fi

        # Extract project_id from tfvars
        TARGET_PROJECT_ID="${_TARGET_PROJECT_ID}"
        if [ -z "$$TARGET_PROJECT_ID" ] && [ -f "$$ENV_FILE" ]; then
          TARGET_PROJECT_ID=$$(sed -n 's/.*project_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$$ENV_FILE" | head -n 1)
        fi

        if [ -z "$$TARGET_PROJECT_ID" ]; then
          echo "ERROR: Unable to resolve TARGET_PROJECT_ID from '$$ENV_FILE' for environment '${_ENVIRONMENT}'!" >&2
          exit 1
        fi

        STATE_BUCKET="${_STATE_BUCKET:-gcs-$${TARGET_PROJECT_ID}-tfstate}"
        STATE_PREFIX="${_STATE_PREFIX:-terraform/infra/state}"

        # Persist context for subsequent steps
        echo "ENVIRONMENT=$$ENVIRONMENT" > .env.build
        echo "ENVIRONMENT_SHORT=$$ENVIRONMENT_SHORT" >> .env.build
        echo "ENV_FILE=$$ENV_FILE" >> .env.build
        echo "TARGET_PROJECT_ID=$$TARGET_PROJECT_ID" >> .env.build
        echo "STATE_BUCKET=$$STATE_BUCKET" >> .env.build

        echo "=================================================================="
        echo "Initializing Root Terraform (infra/) for: $$ENVIRONMENT ($$ENVIRONMENT_SHORT)"
        echo "Target Project: $$TARGET_PROJECT_ID | Bucket: $$STATE_BUCKET"
        echo "=================================================================="

        terraform init -reconfigure \
          -backend-config="bucket=$$STATE_BUCKET" \
          -backend-config="prefix=$$STATE_PREFIX"

        echo "=================================================================="
        echo "Initializing UDP Terraform (infra/udp/) for: $$ENVIRONMENT ($$ENVIRONMENT_SHORT)"
        echo "=================================================================="
        cd udp
        terraform init -reconfigure \
          -backend-config="bucket=$$STATE_BUCKET" \
          -backend-config="prefix=terraform/udp/state"
    dir: 'infra'

  # 2. Terraform Plan (Root infra/ + UDP infra/udp/)
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        . ./.env.build
        echo "=================================================================="
        echo "Running Root Terraform Plan (infra/) using: $$ENV_FILE"
        echo "=================================================================="
        terraform plan \
          -out=tfplan \
          -var-file="$$ENV_FILE" \
          -var="region=$_REGION" \
          -var="environment=$$ENVIRONMENT"

        echo "=================================================================="
        echo "Running UDP Terraform Plan (infra/udp/) using: $$ENV_FILE"
        echo "=================================================================="
        cd udp
        terraform plan \
          -out=tfplan \
          -var-file="$$ENV_FILE" \
          -var="region=$_REGION" \
          -var="environment=$$ENVIRONMENT"
    dir: 'infra'

  # 3. Terraform Apply (Runs ONLY on main branch push, tag push, or explicit _TF_ACTION=apply)
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        . ./.env.build
        SHOULD_APPLY=false
        if [ "${_TF_ACTION}" = "apply" ]; then
          SHOULD_APPLY=true
        elif [ "${_TF_ACTION}" = "plan" ]; then
          SHOULD_APPLY=false
        elif [ "${_TF_ACTION}" = "auto" ] || [ -z "${_TF_ACTION}" ]; then
          if [ "$BRANCH_NAME" = "main" ] || [ -n "$TAG_NAME" ]; then
            SHOULD_APPLY=true
          fi
        fi

        if [ "$$SHOULD_APPLY" != "true" ]; then
          echo "=================================================================="
          echo "Skipping terraform apply (planning only)."
          echo "Trigger details: BRANCH_NAME='$BRANCH_NAME', TAG_NAME='$TAG_NAME', _TF_ACTION='${_TF_ACTION}'"
          echo "(Terraform apply executes only on 'main' branch, tag push, or when _TF_ACTION='apply')"
          echo "=================================================================="
          exit 0
        fi

        echo "=================================================================="
        echo "Applying Root Terraform plan (infra/) for $$ENVIRONMENT"
        echo "=================================================================="
        terraform apply -auto-approve tfplan

        echo "=================================================================="
        echo "Applying UDP Terraform plan (infra/udp/) for $$ENVIRONMENT"
        echo "=================================================================="
        cd udp
        terraform apply -auto-approve tfplan
    dir: 'infra'

  # 4. Bootstrap Bronze, Silver, Gold, and Operations Tables in pid-nse-stg-core-apps-k8ti
  - name: 'python:3.11-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install -q google-cloud-bigquery
        PROJECT_ID=pid-nse-stg-core-apps-k8ti python3 app/udp/utilities/bootstrap_standardized_datasets.py

substitutions:
  _TF_ACTION: 'auto'              # 'auto' (applies on main/tag, plans on other branches), or 'plan' / 'apply'
  _ENVIRONMENT: 'development'     # 'development', 'staging', 'production'
  _TARGET_PROJECT_ID: ''          # Auto-detected from tfvars if empty
  _STATE_PREFIX: 'terraform/infra/state'
  _STATE_BUCKET: ''               # Defaults to gcs-${TARGET_PROJECT_ID}-tfstate
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
