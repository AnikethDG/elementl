# ==============================================================================
# Cloud Build Pipeline: Infrastructure (Terraform)
# ==============================================================================
# - Pull Request Triggers: Runs 'terraform plan' only
# - Main Merge / Tag Triggers: Runs 'terraform plan' followed by 'terraform apply'
# ==============================================================================

steps:
  # 1. Resolve Environment & Terraform Init (Root infra/)
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        case "$PROJECT_ID" in
          elementl-2)
            ENVIRONMENT="development"
            ENVIRONMENT_SHORT="dev"
            TARGET_PROJECT_ID="elementl-2"
            ;;
          *dev*)
            ENVIRONMENT="development"
            ENVIRONMENT_SHORT="dev"
            TARGET_PROJECT_ID="elementl-2"
            ;;
          *stg*)
            ENVIRONMENT="staging"
            ENVIRONMENT_SHORT="stg"
            TARGET_PROJECT_ID="pid-nse-stg-core-apps-k8ti"
            ;;
          *prd*)
            ENVIRONMENT="production"
            ENVIRONMENT_SHORT="prd"
            TARGET_PROJECT_ID="pid-nse-prd-core-apps-6aw8"
            ;;
          *)
            RAW_ENV="${_ENVIRONMENT}"
            case "$$RAW_ENV" in
              stg|stage|staging)
                ENVIRONMENT="staging"
                ENVIRONMENT_SHORT="stg"
                ;;
              prd|prod|production)
                ENVIRONMENT="production"
                ENVIRONMENT_SHORT="prd"
                ;;
              dev|development|*)
                ENVIRONMENT="development"
                ENVIRONMENT_SHORT="dev"
                ;;
            esac
            ENV_FILE="environments/$${ENVIRONMENT}.tfvars"
            TARGET_PROJECT_ID=$$(sed -n 's/.*project_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$$ENV_FILE" | head -n 1)
            ;;
        esac

        ENV_FILE="environments/$${ENVIRONMENT}.tfvars"
        STATE_BUCKET="gcs-$${TARGET_PROJECT_ID}-tfstate"
        STATE_PREFIX="terraform/infra/state"

        # Persist context for subsequent steps
        echo "ENVIRONMENT=$$ENVIRONMENT" > .env.build
        echo "ENVIRONMENT_SHORT=$$ENVIRONMENT_SHORT" >> .env.build
        echo "ENV_FILE=$$ENV_FILE" >> .env.build
        echo "TARGET_PROJECT_ID=$$TARGET_PROJECT_ID" >> .env.build
        echo "STATE_BUCKET=$$STATE_BUCKET" >> .env.build
        echo "STATE_PREFIX=$$STATE_PREFIX" >> .env.build

        echo "=================================================================="
        echo "Initializing Root Terraform (infra/) for: $$ENVIRONMENT ($$ENVIRONMENT_SHORT)"
        echo "Target Project: $$TARGET_PROJECT_ID | Bucket: $$STATE_BUCKET | Prefix: $$STATE_PREFIX"
        echo "=================================================================="

        terraform init -reconfigure -lock=false \
          -backend-config="bucket=$$STATE_BUCKET" \
          -backend-config="prefix=$$STATE_PREFIX"
    dir: 'infra'

  # 2. Terraform Plan (Root infra/)
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        . ./.env.build
        echo "=================================================================="
        echo "Running Root Terraform Plan (infra/) using: $$ENV_FILE"
        echo "=================================================================="
        terraform plan -lock=false \
          -out=tfplan \
          -var-file="$$ENV_FILE" \
          -var="region=$_REGION" \
          -var="environment=$$ENVIRONMENT" || \
        terraform plan -lock=false -refresh=false \
          -out=tfplan \
          -var-file="$$ENV_FILE" \
          -var="region=$_REGION" \
          -var="environment=$$ENVIRONMENT"
    dir: 'infra'

  # 3. Terraform Apply (Runs ONLY on main branch push, tag push, or explicit _TF_ACTION=apply)
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        . ./.env.build
        SHOULD_APPLY=false
        if [ "${_TF_ACTION}" = "apply" ]; then
          SHOULD_APPLY=true
        elif [ "${_TF_ACTION}" = "plan" ]; then
          SHOULD_APPLY=false
        elif [ "${_TF_ACTION}" = "auto" ] || [ -z "${_TF_ACTION}" ]; then
          if [ "$BRANCH_NAME" = "main" ] || [ -n "$TAG_NAME" ]; then
            SHOULD_APPLY=true
          fi
        fi

        if [ "$$SHOULD_APPLY" != "true" ]; then
          echo "=================================================================="
          echo "Skipping terraform apply (planning only)."
          echo "Trigger details: BRANCH_NAME='$BRANCH_NAME', TAG_NAME='$TAG_NAME', _TF_ACTION='${_TF_ACTION}'"
          echo "=================================================================="
          exit 0
        fi

        echo "=================================================================="
        echo "Applying Root Terraform plan (infra/) for $$ENVIRONMENT ($$TARGET_PROJECT_ID)"
        echo "=================================================================="
        terraform apply -auto-approve tfplan
    dir: 'infra'

substitutions:
  _TF_ACTION: 'auto'
  _ENVIRONMENT: 'development'
  _TARGET_PROJECT_ID: 'elementl-2'
  _STATE_PREFIX: 'terraform/infra/state'
  _UDP_STATE_PREFIX: 'terraform/udp/state'
  _STATE_BUCKET: ''
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
