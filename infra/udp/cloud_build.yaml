steps:
  - id: resolve-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    dir: infra/udp
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        RAW_ENV="${_ENVIRONMENT}"
        TARGET_PROJECT_DEFAULT="${_TARGET_PROJECT_ID}"

        case "${PROJECT_ID}" in
          *dev*) ENVIRONMENT="development" ;;
          *prd*) ENVIRONMENT="production" ;;
          *stg*|*)
            case "$${RAW_ENV}" in
              prod|production) ENVIRONMENT="production" ;;
              dev|development) ENVIRONMENT="development" ;;
              stage|staging|*) ENVIRONMENT="staging" ;;
            esac
            ;;
        esac

        TF_VARS_FILE="environments/$${ENVIRONMENT}.tfvars"
        TARGET_PROJECT=$$(sed -n 's/.*project_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$${TF_VARS_FILE}")
        if [ -z "$${TARGET_PROJECT}" ]; then
          TARGET_PROJECT="$${TARGET_PROJECT_DEFAULT}"
        fi
        STATE_BUCKET="gcs-$${TARGET_PROJECT}-tfstate"
        UDP_STATE_PREFIX="${_UDP_STATE_PREFIX}"

        cat <<EOF > /workspace/tf_udp_env.sh
        export ENVIRONMENT="$${ENVIRONMENT}"
        export TF_VARS_FILE="$${TF_VARS_FILE}"
        export TARGET_PROJECT="$${TARGET_PROJECT}"
        export STATE_BUCKET="$${STATE_BUCKET}"
        export UDP_STATE_PREFIX="$${UDP_STATE_PREFIX}"
        EOF

        cat /workspace/tf_udp_env.sh

  - id: terraform-init
    name: hashicorp/terraform:1.9.8
    dir: infra/udp
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        . /workspace/tf_udp_env.sh
        terraform init -reconfigure \
          -backend-config="bucket=$${STATE_BUCKET}" \
          -backend-config="prefix=$${UDP_STATE_PREFIX}"

  - id: terraform-validate
    name: hashicorp/terraform:1.9.8
    dir: infra/udp
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        terraform validate

  - id: terraform-plan
    name: hashicorp/terraform:1.9.8
    dir: infra/udp
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        . /workspace/tf_udp_env.sh
        terraform plan -no-color -input=false -var-file="$${TF_VARS_FILE}" -out=udp_tfplan

  - id: terraform-apply
    name: hashicorp/terraform:1.9.8
    dir: infra/udp
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        if [ "${_ACTION}" = "apply" ]; then
          terraform apply -no-color -input=false -auto-approve udp_tfplan
        else
          echo "Skipping infra/udp/ terraform apply because _ACTION='${_ACTION}'."
        fi

substitutions:
  _ENVIRONMENT: 'staging'
  _TARGET_PROJECT_ID: 'pid-nse-stg-core-apps-k8ti'
  _ACTION: 'plan'
  _UDP_STATE_PREFIX: 'terraform/udp/state'

options:
  logging: CLOUD_LOGGING_ONLY
