steps:
  - name: 'hashicorp/terraform:1.5'
    dir: 'infra/udp'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        ENV_FILE="environments/${_ENVIRONMENT:-staging}.tfvars"
        if [ ! -f "$$ENV_FILE" ]; then
          ENV_FILE="environments/dev.tfvars"
        fi
        TARGET_PROJECT_ID=$$(sed -n 's/.*project_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*//p' "$$ENV_FILE" | head -n 1)
        STATE_BUCKET="gcs-$${TARGET_PROJECT_ID}-tfstate"
        terraform init -reconfigure           -backend-config="bucket=$$STATE_BUCKET"           -backend-config="prefix=terraform/udp/state"
        terraform plan -out=tfplan -var-file="$$ENV_FILE"
        if [ "${_TF_ACTION}" = "apply" ]; then
          terraform apply -auto-approve tfplan
        fi
