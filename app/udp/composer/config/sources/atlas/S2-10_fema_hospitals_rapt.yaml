template: ingestion_task_metadata
version: '1.0'
task_id: atlas_s2_10_fema_hospitals_rapt
description: "FEMA RAPT Hospitals FeatureServer (replaces discontinued NASA HIFLD endpoint per Akshya)"
metadata_status: Active
source:
  type: arcgis
  atlas_source_id: "S2-10"
  endpoint: "https://services.arcgis.com/XG15cJAlne2vxtgt/arcgis/rest/services/Hospitals_RAPT/FeatureServer/0/query"
  load_type: full_refresh
  page_size: 500
  timeout_seconds: 300
engine:
  type: cloud_run_job
  job_name: arcgis-ingestion
  timeout_seconds: 600
  memory: 4Gi
destination:
  format: PARQUET
  gcs_bucket: bkt-pid-nse-stg-core-apps-k8ti-udp-bronze-raw
  gcs_prefix: atlas/raw/S2-10
  bq_project: pid-nse-stg-core-apps-k8ti
  bq_dataset: ds_bronze_atlas
  bq_table: hospitals_fema_rapt
  envelope_table: atlas_raw_envelope
  write_disposition: WRITE_TRUNCATE
