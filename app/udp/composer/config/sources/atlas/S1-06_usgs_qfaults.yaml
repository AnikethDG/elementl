template: ingestion_task_metadata
version: '1.0'
task_id: atlas_s1_06_usgs_qfaults
description: "USGS Quaternary Fault & Fold Database MapServer (Case-sensitive Qfaults per Akshya)"
metadata_status: Active
source:
  type: arcgis
  atlas_source_id: "S1-06"
  endpoint: "https://earthquake.usgs.gov/arcgis/rest/services/haz/Qfaults/MapServer/0/query"
  load_type: full_refresh
  page_size: 500
  timeout_seconds: 300
engine:
  type: cloud_run_job
  job_name: arcgis-ingestion
  timeout_seconds: 600
  memory: 4Gi
destination:
  format: PARQUET
  gcs_bucket: bkt-pid-nse-stg-core-apps-k8ti-udp-bronze-raw
  gcs_prefix: atlas/raw/S1-06
  bq_project: pid-nse-stg-core-apps-k8ti
  bq_dataset: raw_atlas
  bq_table: capable_faults_usgs_qfaults
  envelope_table: atlas_raw_envelope
  write_disposition: WRITE_TRUNCATE
