template: ingestion_task_metadata
version: '1.0'
task_id: atlas_s2_20_census_population
description: "US Census ACS 5-Year County Population Density"
metadata_status: Active
source:
  type: bulk
  atlas_source_id: "S2-20"
  endpoint: "https://api.census.gov/data/2022/acs/acs5?get=NAME,B01003_001E&for=county:*&in=state:56"
  load_type: full_refresh
  page_size: 500
  timeout_seconds: 300
engine:
  type: cloud_run_job
  job_name: bulk-ingestion
  timeout_seconds: 600
  memory: 4Gi
destination:
  format: PARQUET
  gcs_bucket: bkt-pid-nse-stg-core-apps-k8ti-udp-bronze-raw
  gcs_prefix: atlas/raw/S2-20
  bq_project: pid-nse-stg-core-apps-k8ti
  bq_dataset: raw_atlas
  bq_table: population_density_us_census
  envelope_table: atlas_raw_envelope
  write_disposition: WRITE_TRUNCATE
