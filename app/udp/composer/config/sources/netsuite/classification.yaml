template: ingestion_task_metadata
version: '1.0'
task_id: netsuite_classification
description: Extracts NetSuite classification via OAuth 2.0 M2M JWT SuiteQL Cloud Run Job
metadata_status: Active
source:
  type: netsuite
  connection_secret_id: secret-netsuite-api-config
  private_key_secret_id: secret-netsuite-private-key
  account_id_secret_id: secret-netsuite-account-id
  client_id_secret_id: secret-netsuite-client-id
  certificate_id_secret_id: secret-netsuite-certificate-id
  scope_secret_id: secret-netsuite-scope
  extraction_type: suiteql
  query: "SELECT id, name, fullname, isinactive, lastmodifieddate FROM classification"
  load_type: full_refresh
  watermark_column: lastmodifieddate
  page_size: 1000
  timeout_seconds: 300
engine:
  type: cloud_run_job
  job_name: suiteql-ingestion
  timeout_seconds: 600
  memory: 4Gi
destination:
  format: PARQUET
  gcs_bucket: bkt-pid-nse-stg-core-apps-k8ti-udp-bronze-raw
  gcs_prefix: netsuite/raw/classification
  bq_project: pid-nse-stg-core-apps-k8ti
  bq_dataset: ds_bronze_netsuite
  bq_table: netsuite_classification
  write_disposition: WRITE_TRUNCATE
