steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'app/udp/cloud-run-jobs/suiteQL-ingestion'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_TARGET_PROJECT_ID}/udp-ingestion-jobs/suiteQL-ingestion:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_TARGET_PROJECT_ID}/udp-ingestion-jobs/suiteQL-ingestion:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${_TARGET_PROJECT_ID}/udp-ingestion-jobs/suiteQL-ingestion'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'suiteql-ingestion'
      - '--image=${_REGION}-docker.pkg.dev/${_TARGET_PROJECT_ID}/udp-ingestion-jobs/suiteQL-ingestion:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--project=${_TARGET_PROJECT_ID}'
substitutions:
  _REGION: 'us-central1'
  _TARGET_PROJECT_ID: 'pid-nse-stg-core-apps-k8ti'
