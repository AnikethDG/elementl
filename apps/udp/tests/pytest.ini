[pytest]
testpaths = unit integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Fast, isolated unit tests with mocks and no GCP network calls.
    integration: Live GCP integration tests against project elementl-509009 (BigQuery, GCS, Cloud Run, Composer).
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
