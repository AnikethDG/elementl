template: ingestion_task_metadata
version: '1.0'
task_id: sample_netsuite_json
display_name: "Sample NetSuite JSON Ingestion"
description: "Sample configuration demonstrating JSON (NDJSON) landing format for NetSuite SuiteQL extraction."
domain: "finance"
metadata_status: Active

source:
  type: netsuite
  load_type: full_refresh
  watermark_column: lastmodifieddate
  connection_secret_id: "secret-netsuite-api-config"
  extraction_type: suiteql
  source_table: vendor
  primary_key: id
  where_clause: "ROWNUM <= 10"
  max_records: 10
  page_size: 1000
  timeout_seconds: 300
  query: "SELECT id, entityid, companyname FROM vendor WHERE ROWNUM <= 10"

engine:
  type: cloud_run_job
  job_name: suiteql-ingestion
  timeout_seconds: 1800

destination:
  format: JSON
  schema_strategy: static
  gcs_bucket: "bkt-elementl-509009-udp-bronze-raw"
  gcs_prefix: "netsuite/raw/sample_netsuite_json/dt={{ ds }}/"
  bq_project: "elementl-509009"
  bq_dataset: "ds_bronze_netsuite"
  bq_table: "sample_netsuite_json"
  write_disposition: WRITE_TRUNCATE
  partition_field: ingestion_date
  cluster_fields:
    - id

orchestration:
  dag_id: dag_udp_sample_netsuite_json
  schedule: "@daily"
  start_date: "2024-01-01 00:00:00"
  catchup: false
  retries: 1
  retry_delay_minutes: 5
  dataform:
    enabled: true
    target_dataset: "ds_silver"
    target_table: "stg_sample_netsuite_json"
    included_tags:
      - netsuite
      - sample_netsuite_json
