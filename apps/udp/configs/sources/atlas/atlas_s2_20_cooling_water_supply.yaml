template: ingestion_task_metadata
version: '1.0'
task_id: atlas_s2_20_cooling_water_supply
display_name: "USGS National Water Information System (Cooling Water Supply)"
description: "Ingests hydrologic streamflow rates and cooling water availability measurements from USGS NWIS Daily Values API (Criterion S2-20)."
domain: "hydrography_water_supply"
metadata_status: Active

source:
  type: atlas
  category: tabular_api
  format: tabular_jsonl
  load_type: full_refresh
  connection:
    endpoint_url: "https://waterservices.usgs.gov/"
    layer_id: "S2-20"
    auth_type: none
    query_params:
      where: "1=1"
      outFields: "*"
    timeout_seconds: 180
    max_retries: 5

engine:
  type: cloud_run_job
  job_name: bulk-ingestion
  timeout_seconds: 3600

destination:
  format: TABULAR_JSONL
  schema_strategy: generic_envelope
  domain_tags:
    - "S2-20"
    - "cooling_water"
    - "surface_water"
  unpack_archive: true
  gcs_bucket: "bkt-elementl-509009-udp-bronze-raw"
  gcs_prefix: "atlas/raw/atlas_s2_20_cooling_water_supply/dt={{ ds }}/"
  bq_project: "elementl-509009"
  bq_dataset: "ds_bronze_atlas"
  bq_table: "atlas_s2_20_cooling_water_supply"
  write_disposition: WRITE_TRUNCATE
  partition_field: ingestion_date

orchestration:
  dag_id: dag_udp_atlas_s2_20_cooling_water_supply
  schedule: "@weekly"
  start_date: "2024-01-01 00:00:00"
  catchup: false
  retries: 2
  retry_delay_minutes: 5
  concurrency: 1
  dag_tags:
    - "source:atlas"
    - "engine:cloud_run_job"
    - "zone:raw"
    - "criteria:s2_20"
  dataform:
    enabled: true
    target_dataset: "ds_silver"
    target_table: "stg_atlas_s2_20_cooling_water_supply"
    included_tags:
      - "atlas"
      - "atlas_s2_20_cooling_water_supply"
    transitive_dependencies_included: false
