template: ingestion_task_metadata
version: '1.0'
task_id: sample_atlas_same_as_origin
display_name: "Sample Atlas Native Origin Ingestion"
description: "Sample configuration demonstrating SAME_AS_ORIGIN format preserving native GeoJSON/ArcGIS envelopes (Atlas only)."
domain: "geospatial"
metadata_status: Active

source:
  type: atlas
  category: arcgis_rest
  format: geojson_ndjson
  load_type: full_refresh
  watermark_column: null
  connection:
    endpoint_url: "https://earthquake.usgs.gov/arcgis/rest/services/haz/Qfaults/MapServer"
    layer_id: 21
    auth_type: none
    query_params:
      where: "1=1"
      outFields: "*"
    timeout_seconds: 180
    max_retries: 5

engine:
  type: cloud_run_job
  job_name: arcgis-ingestion
  timeout_seconds: 3600

destination:
  format: SAME_AS_ORIGIN
  schema_strategy: generic_envelope
  domain_tags:
    - "S1-06"
    - "capable_faults"
  unpack_archive: false
  gcs_bucket: "bkt-elementl-509009-udp-bronze-raw"
  gcs_prefix: "atlas/raw/sample_atlas_same_as_origin/dt={{ ds }}/"
  bq_project: "elementl-509009"
  bq_dataset: "ds_bronze_atlas"
  bq_table: "sample_atlas_same_as_origin"
  write_disposition: WRITE_TRUNCATE
  partition_field: ingestion_date

orchestration:
  dag_id: dag_udp_sample_atlas_same_as_origin
  schedule: "@daily"
  start_date: "2024-01-01 00:00:00"
  catchup: false
  retries: 1
  retry_delay_minutes: 5
  dataform:
    enabled: true
    target_dataset: "ds_silver"
    target_table: "stg_sample_atlas_same_as_origin"
    included_tags:
      - atlas
      - sample_atlas_same_as_origin
