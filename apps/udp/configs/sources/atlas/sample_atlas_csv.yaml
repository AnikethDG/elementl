template: ingestion_task_metadata
version: '1.0'
task_id: sample_atlas_csv
display_name: "Sample Atlas CSV Ingestion"
description: "Sample configuration demonstrating CSV landing format for Atlas extraction."
domain: "water"
metadata_status: Active

source:
  type: atlas
  category: tabular_api
  format: tabular_jsonl
  load_type: full_refresh
  watermark_column: null
  connection:
    endpoint_url: "https://waterservices.usgs.gov/nwis/iv/?format=json&stateCd=RI&parameterCd=00060"
    layer_id: null
    auth_type: none
    query_params: {}
    timeout_seconds: 180
    max_retries: 5

engine:
  type: cloud_run_job
  job_name: bulk-ingestion
  timeout_seconds: 3600

destination:
  format: CSV
  schema_strategy: static
  domain_tags:
    - "S2-20"
    - "cooling_water"
  unpack_archive: false
  gcs_bucket: "bkt-elementl-509009-udp-bronze-raw"
  gcs_prefix: "atlas/raw/sample_atlas_csv/dt={{ ds }}/"
  bq_project: "elementl-509009"
  bq_dataset: "ds_bronze_atlas"
  bq_table: "sample_atlas_csv"
  write_disposition: WRITE_TRUNCATE
  partition_field: ingestion_date

orchestration:
  dag_id: dag_udp_sample_atlas_csv
  schedule: "@daily"
  start_date: "2024-01-01 00:00:00"
  catchup: false
  retries: 1
  retry_delay_minutes: 5
  dataform:
    enabled: true
    target_dataset: "ds_silver"
    target_table: "stg_sample_atlas_csv"
    included_tags:
      - atlas
      - sample_atlas_csv
