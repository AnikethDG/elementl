# ==============================================================================
# Cloud Build Pipeline: apps/service-api
# ==============================================================================
# Supports Trunk-Based Deployment & Multi-Project Promotion:
# - Pull Requests: Runs Unit Tests & Builds Container Image (validation only)
# - Branch Merge / Push (main) -> Tests, builds, pushes, and deploys to Dev project
# - Tag push (v*.*.*) -> Tests, builds, pushes, and deploys to Staging/Prod project
# ==============================================================================

steps:
  # 1. Run Unit Tests (always runs on PRs and merges)
  - name: 'python:3.11-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "=================================================================="
        echo "Running Unit Tests for apps/service-api"
        echo "=================================================================="
        pip install --no-cache-dir -r requirements.txt
        pytest
    dir: 'apps/service-api'

  # 2. Build Container Image (runs on both PRs and merges to validate container assembly)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        RAW_ENV="${_ENVIRONMENT}"
        case "$$RAW_ENV" in
          stg|staging)
            ENVIRONMENT="staging"
            ENVIRONMENT_SHORT="stg"
            ;;
          prd|prod|production)
            ENVIRONMENT="production"
            ENVIRONMENT_SHORT="prd"
            ;;
          dev|development|*)
            ENVIRONMENT="development"
            ENVIRONMENT_SHORT="dev"
            ;;
        esac

        # Auto-detect target project from tfvars if not supplied
        TARGET_PROJECT="${_TARGET_PROJECT_ID}"
        if [ -z "$$TARGET_PROJECT" ]; then
          TFVARS_FILE="../../infra/environments/$${ENVIRONMENT}.tfvars"
          if [ -f "$$TFVARS_FILE" ]; then
            TARGET_PROJECT=$$(sed -n 's/.*project_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$$TFVARS_FILE" | head -n 1)
          fi
          if [ -z "$$TARGET_PROJECT" ]; then
            TARGET_PROJECT="$PROJECT_ID"
          fi
        fi

        # Check deployment condition
        CURRENT_BRANCH="$BRANCH_NAME"
        CURRENT_TAG="$TAG_NAME"

        SHOULD_DEPLOY=false
        if [ "${_ACTION}" = "deploy" ]; then
          SHOULD_DEPLOY=true
        elif [ "${_ACTION}" = "test" ]; then
          SHOULD_DEPLOY=false
        elif [ "${_ACTION}" = "auto" ] || [ -z "${_ACTION}" ]; then
          if [ "$$CURRENT_BRANCH" = "main" ] || [ -n "$$CURRENT_TAG" ]; then
            SHOULD_DEPLOY=true
          fi
        fi

        if [ "$$SHOULD_DEPLOY" = "true" ] && [ -z "$$TARGET_PROJECT" ]; then
          echo "ERROR: Unable to resolve TARGET_PROJECT from '$${TFVARS_FILE}' for environment '$${ENVIRONMENT}'!" >&2
          exit 1
        fi

        # Persist context for subsequent steps
        echo "SHOULD_DEPLOY=$$SHOULD_DEPLOY" > .env.app.build
        echo "TARGET_PROJECT=$$TARGET_PROJECT" >> .env.app.build
        echo "ENVIRONMENT=$$ENVIRONMENT" >> .env.app.build
        echo "ENVIRONMENT_SHORT=$$ENVIRONMENT_SHORT" >> .env.app.build
        echo "CURRENT_TAG=$$CURRENT_TAG" >> .env.app.build

        echo "=================================================================="
        echo "Building container image for project: $$TARGET_PROJECT ($$ENVIRONMENT / $$ENVIRONMENT_SHORT)"
        echo "Trigger details: BRANCH_NAME='$BRANCH_NAME', TAG_NAME='$TAG_NAME', SHOULD_DEPLOY=$$SHOULD_DEPLOY"
        echo "=================================================================="
        TAG_ARGS=""
        if [ -n "$$CURRENT_TAG" ]; then
          TAG_ARGS="-t $_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$$CURRENT_TAG"
        fi

        docker build \
          -t "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$COMMIT_SHA" \
          -t "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$$ENVIRONMENT" \
          -t "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$$ENVIRONMENT_SHORT" \
          $$TAG_ARGS \
          .
    dir: 'apps/service-api'

  # 3. Push Container Images to Target Artifact Registry (only runs on merge to main or tag push)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ -f .env.app.build ]; then . ./.env.app.build; fi

        if [ "$$SHOULD_DEPLOY" = "true" ]; then
          echo "=================================================================="
          echo "Pushing images to Artifact Registry in project: $$TARGET_PROJECT"
          echo "=================================================================="
          docker push "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$COMMIT_SHA"
          docker push "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$$ENVIRONMENT"
          docker push "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$$ENVIRONMENT_SHORT"
          if [ -n "$$CURRENT_TAG" ]; then
            docker push "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$$CURRENT_TAG"
          fi
        else
          echo "=================================================================="
          echo "Skipping container push (PR trigger / push runs only on merge to main or tag push)"
          echo "=================================================================="
        fi
    dir: 'apps/service-api'

  # 4. Deploy Revision to Target Cloud Run Service (only runs on merge to main or tag push)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ -f .env.app.build ]; then . ./.env.app.build; fi

        if [ "$$SHOULD_DEPLOY" = "true" ]; then
          echo "=================================================================="
          echo "Deploying Cloud Run service to project: $$TARGET_PROJECT ($$ENVIRONMENT / $$ENVIRONMENT_SHORT)"
          echo "=================================================================="
          gcloud run deploy "$_SERVICE_NAME" \
            --image "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$COMMIT_SHA" \
            --region "$_REGION" \
            --project "$$TARGET_PROJECT" \
            --update-env-vars "ENVIRONMENT=$$ENVIRONMENT,ENVIRONMENT_SHORT=$$ENVIRONMENT_SHORT" \
            --quiet
        else
          echo "=================================================================="
          echo "Skipping Cloud Run deployment (PR trigger / deploy runs only on merge to main or tag push)"
          echo "=================================================================="
        fi
    dir: 'apps/service-api'

substitutions:
  _ACTION: 'auto'               # 'auto' (pushes/deploys on main/tag, builds & tests on PRs), or 'test' / 'deploy'
  _ENVIRONMENT: 'development'   # 'development', 'staging', 'production'
  _TARGET_PROJECT_ID: 'elementl-2' # Auto-detected from infra/environments/<env>.tfvars if empty
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'app-repo'
  _SERVICE_NAME: 'service-api'

options:
  logging: CLOUD_LOGGING_ONLY

