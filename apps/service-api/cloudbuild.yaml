# ==============================================================================
# Cloud Build Pipeline: apps/service-api
# ==============================================================================
# Supports Trunk-Based Deployment & Multi-Project Promotion:
# - Each environment (dev, staging, prod) runs in its own GCP project.
# - Push to `main` -> Deploys to Dev project
# - Tag push (`v*.*.*`) -> Deploys to Staging project & triggers approval for Prod project
# ==============================================================================

steps:
  # 1. Run Unit Tests
  - name: 'python:3.11-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest
    dir: 'apps/service-api'

  # 2. Build Container Image (Build once with immutable commit SHA)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        TARGET_PROJECT="${_TARGET_PROJECT_ID:-$PROJECT_ID}"
        echo "Building image for project: $$TARGET_PROJECT"
        docker build \
          -t "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$COMMIT_SHA" \
          -t "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$_ENVIRONMENT" \
          .
    dir: 'apps/service-api'

  # 3. Push Container Images to Target Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        TARGET_PROJECT="${_TARGET_PROJECT_ID:-$PROJECT_ID}"
        echo "Pushing image to project: $$TARGET_PROJECT"
        docker push "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$COMMIT_SHA"
        docker push "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$_ENVIRONMENT"
    dir: 'apps/service-api'

  # 4. Deploy Revision to Target Cloud Run Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        TARGET_PROJECT="${_TARGET_PROJECT_ID:-$PROJECT_ID}"
        echo "Deploying Cloud Run service to project: $$TARGET_PROJECT"
        gcloud run deploy "$_SERVICE_NAME" \
          --image "$_REGION-docker.pkg.dev/$$TARGET_PROJECT/$_ARTIFACT_REPO/$_SERVICE_NAME:$COMMIT_SHA" \
          --region "$_REGION" \
          --project "$$TARGET_PROJECT" \
          --update-env-vars "ENVIRONMENT=$_ENVIRONMENT"
    dir: 'apps/service-api'

substitutions:
  _ENVIRONMENT: 'dev'
  _TARGET_PROJECT_ID: '' # If empty, defaults to $PROJECT_ID at runtime
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'app-repo'
  _SERVICE_NAME: 'service-api'

options:
  logging: CLOUD_LOGGING_ONLY
